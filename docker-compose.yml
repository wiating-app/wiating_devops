---
services:
    app:
        build:
            context: ./wiating_backend
        env_file: .env
        command: uvicorn wiating_backend.main:app --reload --log-level trace --host 0.0.0.0 --port 5000
        ports:
            - 5813:5000
        volumes:
            - ./wiating_backend:/opt/wiating
            - ./scripts:/opt/wiating/scripts
            - ./provisioning/roles:/opt/wiating/devops
            - images:/images
        depends_on:
            - elasticsearch
            - rabbitmq
            - image_resizer
            - redis
            - keycloak

    image_resizer:
        build:
            context: ./image_resizer
        env_file: .env
        command: python3 -m celery -A image_resizer worker --loglevel=info
        depends_on:
            - rabbitmq
        volumes:
            - ./image_resizer:/opt/image_resizer
            - images:/images
    
    postgres:
        image: postgres:16.0
        environment:
            POSTGRES_USER: testkeycloakuser
            POSTGRES_PASSWORD: testkeycloakpassword
            POSTGRES_DB: testkeycloakdb
        ports:
            - 5432:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: always

    keycloak:
        image: keycloak/keycloak:26.0.1
        environment:
            - KEYCLOAK_ADMIN=admin
            - KEYCLOAK_ADMIN_PASSWORD=admin
            - KC_DB=postgres
            - KC_DB_URL=jdbc:postgresql://postgres:5432/testkeycloakdb
            - KC_DB_USERNAME=testkeycloakuser
            - KC_DB_PASSWORD=testkeycloakpassword
            - KC_HOSTNAME=localhost
            - KC_PROXY=edge
            - KC_LOG_LEVEL=DEBUG
        ports:
            - 8080:8080
        command: "start-dev"
        depends_on:
            - postgres

    elasticsearch:
        build:
            context: ./
            dockerfile: Dockerfile_elasticsearch
            args:
                - ELASTIC_VERSION=7.5.1
        environment:
            - bootstrap.memory_lock=true
            - discovery.type=single-node
        ulimits:
            memlock:
                soft: -1
                hard: -1
        ports:
            - 9200:9200
        volumes:
            - esdata01:/usr/share/elasticsearch/data
        restart: always

    rabbitmq:
        image: rabbitmq:latest
        ports:
            - 5672:5672
        restart: always

    redis:
        image: redis:6.0.9

    frontend:
        restart: always
        build:
            context: ./frontend
        env_file: .env
        volumes:
            - ./frontend:/code
            # https://github.com/BretFisher/node-docker-good-defaults/blob/b13c648411335fbd6927b4421319e1bf2dad05a3/docker-compose.yml#L29
            # prevent host node_modules from accidently getting mounted in container
            - /code/node_modules
        ports:
            - 3000:3000
        stdin_open: true
        command: yarn start
volumes:
    esdata01:
    images:
    postgres_data:
